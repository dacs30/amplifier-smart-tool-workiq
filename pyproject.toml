[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amplifier-smart-tool-workiq"
version = "0.1.0"
description = "Safe, repeatable Microsoft 365 workflows over the official Work IQ MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Microsoft Corporation" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12"
]

[project.scripts]
workiq-smart-tool = "amplifier_smart_tool_workiq.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/amplifier_smart_tool_workiq"]
