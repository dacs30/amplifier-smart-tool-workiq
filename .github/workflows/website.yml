name: Website

on:
  pull_request:
    paths: ['site/**', 'docs/assets/**', '.github/workflows/website.yml']
  push:
    branches: [main]
    paths: ['site/**', 'docs/assets/**', '.github/workflows/website.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this revision to GitHub Pages
        type: boolean
        default: false
      family_owner:
        description: Owner of the overview and catalog sites (robotdad for fork previews)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install website build dependencies
        run: python -m pip install -r site/requirements.txt
      - name: Build website
        env:
          FAMILY_OWNER: ${{ inputs.family_owner || 'microsoft' }}
        run: python site/theme/build.py --family-owner "$FAMILY_OWNER"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  pages:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      enabled: ${{ steps.status.outputs.enabled }}
    steps:
      - name: Check GitHub Pages status
        id: status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          set +e
          status="$(curl --silent --show-error --location --output /tmp/pages.json --write-out "%{http_code}" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")"
          curl_exit="$?"
          set -e

          if [ "$curl_exit" -ne 0 ]; then
            echo "::error::Unable to determine GitHub Pages status (curl exit $curl_exit)."
            exit "$curl_exit"
          elif [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" = "404" ]; then
            echo "::warning::GitHub Pages is not enabled for this repository; skipping deployment."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            cat /tmp/pages.json
            echo "::error::Unable to determine GitHub Pages status (HTTP $status)."
            exit 1
          fi


  deploy:
    if: >-
      needs.pages.outputs.enabled == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish))
    needs: [build, pages]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
